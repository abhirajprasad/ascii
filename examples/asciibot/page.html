<title>Asciibot</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  /* A chat where every answer is a small live poster. One dark room; the accent follows the current art's palette. */
  :root {
    color-scheme: dark;
    --bg: #090b0c;
    --panel: #111415;
    --panel-2: #191d1e;
    --ink: #e8eeec;
    --muted: #8d9895;
    --faint: #5e6966;
    --line: #242a2b;
    --accent: #a3d4c8;
    --sans: Geist, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--sans); overflow: hidden; }
  button { font: inherit; color: inherit; }
  button:focus-visible, textarea:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }
  .column {
    width: 100%; max-width: 860px; margin-inline: auto; box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  header { border-bottom: 1px solid var(--line); }
  header .column { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 11px; }
  .brand { font: 600 13px var(--mono); display: flex; gap: 8px; }
  .brand i { font-style: normal; color: var(--accent); }
  .mode { font: 400 11px var(--mono); color: var(--faint); display: flex; align-items: center; gap: 7px; }
  .mode i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
  .mode.on i { background: var(--accent); }

  #log { overflow-y: auto; scroll-behavior: smooth; }
  #log .column { display: flex; flex-direction: column; gap: 22px; padding-block: 22px 12px; }
  .you { align-self: flex-end; max-width: min(78%, 560px); padding: 9px 14px; background: var(--panel-2); border-radius: 14px 14px 3px 14px; font: 400 13.5px/1.5 var(--mono); overflow-wrap: anywhere; }
  .bot { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .say { margin: 0; max-width: 62ch; }
  .say.note { color: var(--muted); font-size: 13.5px; }
  .again { align-self: flex-start; }

  figure { margin: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #000; display: flex; flex-direction: column; min-width: 0; }
  /* Short enough that a whole exchange (question, answer, art, controls) fits on screen together. */
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: max(240px, calc(100vh - 390px)); cursor: pointer; }
  .current .stage { cursor: crosshair; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .frozen-tag { position: absolute; right: 10px; top: 10px; font: 400 11px var(--mono); color: var(--muted); background: rgba(9, 11, 12, 0.72); padding: 3px 8px; border-radius: 6px; }

  figcaption { display: none; flex-direction: column; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  .current figcaption { display: flex; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .row.split { justify-content: space-between; gap: 10px; }
  .chip {
    all: unset; cursor: pointer; padding: 3px 9px; border-radius: 6px; color: var(--muted); font: 400 12px var(--mono);
  }
  .chip:hover { color: var(--ink); background: var(--panel-2); }
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); box-shadow: inset 0 -1.5px 0 var(--accent); }
  .chip:focus-visible, .swatch:focus-visible, .act:focus-visible, .starter:focus-visible, .icon:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .swatch { all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 5px; border: 1px solid var(--line); box-sizing: border-box; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .swatch.own { background: conic-gradient(#ff5d5d, #ffd25d, #5dff9d, #5dc8ff, #b98cff, #ff5d5d); }
  .act { all: unset; cursor: pointer; padding: 4px 10px; border: 1px solid var(--line); border-radius: 7px; color: var(--muted); font: 500 12px var(--sans); white-space: nowrap; }
  .act:hover { color: var(--ink); border-color: var(--faint); }
  .act.ask { color: var(--ink); border-color: var(--accent); }

  /* One piece of art fills the window. */
  figure.big { position: fixed; inset: 0; z-index: 5; border: 0; border-radius: 0; }
  figure.big .stage { flex: 1; aspect-ratio: auto; max-height: none; min-height: 0; }

  .pending { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: max(240px, calc(100vh - 390px)); box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #000; }
  .pending span { position: absolute; left: 12px; bottom: 10px; font: 400 12px var(--mono); color: var(--ink); background: rgba(9, 11, 12, 0.78); padding: 3px 9px; border-radius: 6px; }

  footer { border-top: 1px solid var(--line); background: var(--bg); }
  footer .column { padding-block: 10px max(10px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
  #starters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: -2px; }
  #starters::-webkit-scrollbar { display: none; }
  .starter { all: unset; flex: none; cursor: pointer; padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px; font: 400 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .starter:hover { color: var(--ink); border-color: var(--faint); }

  form { display: flex; align-items: flex-end; gap: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
  form:focus-within { border-color: var(--faint); }
  textarea { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent; color: var(--ink); font: 400 15px/1.45 var(--sans); padding: 7px 8px; max-height: 130px; }
  textarea::placeholder { color: var(--faint); }
  textarea:focus-visible { outline: 0; }
  .icon { all: unset; flex: none; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); font: 500 16px var(--mono); }
  .icon:hover { color: var(--ink); background: var(--panel-2); }
  #send { background: var(--ink); color: var(--bg); }
  #send:hover { background: var(--ink); color: var(--bg); opacity: 0.86; }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #hint { margin: 0; font: 400 11px/1.4 var(--mono); color: var(--faint); }

  #toast { position: fixed; z-index: 9; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 7px; font: 500 12.5px var(--sans); }

  @media (max-width: 560px) {
    .you { max-width: 88%; }
    .stage, .pending { aspect-ratio: 1; }
  }
  @media (prefers-reduced-motion: reduce) { #log { scroll-behavior: auto; } }
</style>

<div class="app">
  <header>
    <div class="column">
      <div class="brand"><i>#</i>Asciibot</div>
      <div class="mode" id="mode"><i></i><span id="mode-text">Starting</span></div>
    </div>
  </header>

  <main id="log" aria-live="polite">
    <div class="column" id="messages"></div>
  </main>

  <footer>
    <div class="column">
      <div id="starters" role="group" aria-label="Things to try"></div>
      <form id="composer">
        <label class="icon" title="Turn an image into art" aria-label="Attach an image">+<input id="file" type="file" accept="image/*"></label>
        <textarea id="prompt" rows="1" aria-label="What should I draw?" placeholder="What should I draw?"></textarea>
        <button id="send" class="icon" type="submit" aria-label="Send">&#8593;</button>
      </form>
      <p id="hint"></p>
    </div>
  </footer>
</div>
<div id="toast" hidden></div>
<!-- script -->
