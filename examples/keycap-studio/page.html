<title>Keycap Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
  /* A compact workbench: subject on the left, stage in the middle, every dial on the right. */
  :root {
    color-scheme: dark;
    --bg: #0a0c0d;
    --panel: #101314;
    --panel-2: #171b1c;
    --ink: #e9efed;
    --muted: #8b9693;
    --faint: #5b6663;
    --line: #232829;
    --accent: #a3d4c8;
    --sans: Geist, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "Instrument Serif", Georgia, serif;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 13px/1.4 var(--sans); overflow: hidden; }

  .app { height: 100%; display: grid; grid-template-columns: 204px minmax(0, 1fr) 268px; }
  aside { background: var(--panel); overflow-y: auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  aside.left { border-right: 1px solid var(--line); padding-left: max(14px, env(safe-area-inset-left, 0px)); }
  aside.right { border-left: 1px solid var(--line); padding-right: max(14px, env(safe-area-inset-right, 0px)); }

  h2 { margin: 0 0 8px; font: 500 10.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--faint); }
  .brand { font: 600 13px var(--mono); display: flex; gap: 8px; align-items: center; }
  .brand i { font-style: normal; color: var(--accent); }

  .pick { display: grid; gap: 1px; }
  .pick button {
    all: unset; cursor: pointer; padding: 6px 9px; border-radius: 6px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .pick button small { font: 400 10.5px var(--mono); color: var(--faint); }
  .pick button:hover { background: var(--panel-2); color: var(--ink); }
  .pick button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .swatches button { all: unset; cursor: pointer; display: grid; gap: 3px; min-width: 0; }
  .swatches button i { display: block; height: 22px; border-radius: 5px; border: 1px solid var(--line); }
  .swatches button span { font: 400 10px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; }
  .swatches button:hover span { color: var(--ink); }
  .swatches button[aria-pressed="true"] i { border-color: var(--ink); }
  .swatches button[aria-pressed="true"] span { color: var(--ink); }

  .stage { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-width: 0; min-height: 0; background: var(--bg); }
  .view { position: relative; min-height: 0; overflow: hidden; display: grid; place-items: center; }
  #slot-editor { position: absolute; inset: 0; }
  canvas#art { width: 100%; height: 100%; display: block; }

  .bar {
    display: flex; flex-wrap: wrap; gap: 4px; align-items: center; justify-content: center;
    padding: 8px 12px; border-top: 1px solid var(--line); background: var(--panel);
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px));
  }
  .bar button, .bar label.btn {
    all: unset; cursor: pointer; padding: 7px 12px; border-radius: 7px; color: var(--muted); font: 500 12.5px var(--sans);
  }
  .bar button:hover, .bar label.btn:hover { background: var(--panel-2); color: var(--ink); }
  .bar .primary { background: var(--ink); color: var(--bg); }
  .bar .primary:hover { background: var(--ink); color: var(--bg); opacity: 0.88; }
  .bar button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
  .bar label.btn:focus-within { outline: 2px solid var(--accent); }
  #file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  #toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 12px; border-radius: 7px; font: 500 12px var(--sans); z-index: 5; }

  .dial { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; margin-bottom: 11px; }
  .dial span { color: var(--muted); font-size: 12px; }
  .dial output { font: 400 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
  .dial input[type="range"] { grid-column: 1 / -1; width: 100%; margin: 3px 0 0; accent-color: var(--accent); height: 16px; }
  .dial select { grid-column: 1 / -1; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font: 400 12px var(--sans); }

  /* Visualize: a strip of layouts above a live mockup. */
  .layouts { display: none; position: absolute; inset: 0 0 auto 0; z-index: 3; gap: 4px; padding: 8px 12px; overflow-x: auto; background: var(--panel); border-bottom: 1px solid var(--line); }
  .layouts button { all: unset; cursor: pointer; flex: none; padding: 5px 10px; border-radius: 6px; color: var(--muted); font: 400 12px var(--sans); white-space: nowrap; }
  .layouts button:hover { color: var(--ink); background: var(--panel-2); }
  .layouts button[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); }
  .visualizing .layouts { display: flex; }
  #mockup { display: none; position: absolute; inset: 48px 0 0 0; padding: 20px; overflow: auto; box-sizing: border-box; }
  .visualizing #mockup { display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; }
  .slot { position: relative; overflow: hidden; background: #000; min-width: 0; min-height: 0; }
  .slot canvas { position: absolute; inset: 0; }

  /* Layout mockups. Sample content throughout, invented for these frames. */
  .m { color: #111; font-family: var(--sans); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); flex: none; }
  .m-poster { width: min(50vh, 92%); aspect-ratio: 3 / 4.4; background: #0c0c0c; color: #f2efe8; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .m-poster header { display: flex; justify-content: space-between; padding: 12px 16px; font: 500 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .m-poster footer { padding: 14px 16px 16px; }
  .m-poster h3 { margin: 0; font: 800 clamp(34px, 9vh, 72px)/0.9 var(--sans); letter-spacing: -0.04em; text-transform: uppercase; }
  .m-poster p { margin: 10px 0 0; font: 400 12px var(--mono); display: flex; justify-content: space-between; gap: 12px; }

  .m-album { width: min(64vh, 92%); aspect-ratio: 1; background: #000; display: grid; }
  .m-album .slot { grid-area: 1 / 1; }
  .m-album div.t { grid-area: 1 / 1; z-index: 1; align-self: end; padding: 16px 18px; color: #fff; font: 400 clamp(26px, 6vh, 46px)/1 var(--serif); }
  .m-album small { display: block; font: 400 11px var(--mono); margin-top: 6px; opacity: 0.75; }

  .m-phone { width: min(34vh, 70%); aspect-ratio: 9 / 19; border-radius: 38px; padding: 9px; background: #1d1d1f; box-sizing: border-box; }
  .m-phone .screen { position: relative; width: 100%; height: 100%; border-radius: 30px; overflow: hidden; color: #fff; display: grid; }
  .m-phone .slot { grid-area: 1 / 1; }
  .m-phone .lock { grid-area: 1 / 1; z-index: 1; text-align: center; padding-top: 11%; }
  .m-phone .lock small { font: 500 12px var(--sans); }
  .m-phone .lock b { display: block; font: 500 clamp(40px, 9vh, 64px)/1 var(--sans); letter-spacing: -0.03em; margin-top: 2px; }
  .m-phone .note { grid-area: 1 / 1; z-index: 1; align-self: end; margin: 0 10px 22px; padding: 10px 12px; border-radius: 16px; background: rgba(30, 30, 32, 0.62); backdrop-filter: blur(14px); font: 400 11.5px/1.35 var(--sans); }

  .m-bill { width: min(980px, 100%); display: grid; justify-items: center; background: linear-gradient(#27333b, #6a7a80 64%, #2b2d2c 64%, #1a1b1a); padding: 28px 28px 0; box-shadow: none; }
  .m-bill .board { width: 100%; aspect-ratio: 2.9; background: #101010; border: 8px solid #1b1b1b; display: grid; grid-template-columns: 1.15fr 1fr; color: #fff; }
  .m-bill h3 { margin: 0; align-self: center; padding: 0 6%; font: 800 clamp(22px, 4vw, 54px)/0.98 var(--sans); letter-spacing: -0.035em; }
  .m-bill .posts { display: flex; justify-content: space-between; width: 42%; height: 64px; }
  .m-bill .posts i { width: 12px; background: #151616; }

  .m-land { width: min(1060px, 100%); aspect-ratio: 16 / 10; background: #000; color: #fff; display: grid; border-radius: 10px; overflow: hidden; }
  .m-land .slot { grid-area: 1 / 1; }
  .m-land .ui { grid-area: 1 / 1; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 14px 20px; }
  .m-land nav { display: flex; justify-content: space-between; align-items: center; font: 500 12px var(--sans); }
  .m-land nav b { font-weight: 600; }
  .m-land nav span { padding: 6px 12px; background: #fff; color: #000; border-radius: 99px; }
  .m-land .h { align-self: center; justify-self: center; text-align: center; }
  .m-land h3 { margin: 0; font: 600 clamp(30px, 6.4vw, 84px)/0.96 var(--sans); letter-spacing: -0.045em; text-shadow: 0 2px 34px #000; }
  .m-land p { margin: 14px 0 0; font-size: 14px; text-shadow: 0 1px 12px #000; }

  .m-split { width: min(980px, 100%); aspect-ratio: 16 / 10; background: #f6f6f4; display: grid; grid-template-columns: 1fr 1fr; border-radius: 10px; overflow: hidden; }
  .m-split .f { align-self: center; justify-self: center; width: 68%; display: grid; gap: 9px; }
  .m-split h3 { margin: 0 0 6px; font: 600 clamp(18px, 2.6vw, 30px) var(--sans); letter-spacing: -0.03em; }
  .m-split .i { height: 32px; border: 1px solid #cfcfca; border-radius: 7px; background: #fff; display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: #70706b; }
  .m-split .b { height: 34px; border-radius: 7px; background: #161616; color: #fff; display: grid; place-items: center; font: 500 12.5px var(--sans); }

  .m-404 { width: min(980px, 100%); aspect-ratio: 16 / 10; background: #000; color: #eee; display: grid; border-radius: 10px; overflow: hidden; }
  .m-404 .slot { grid-area: 1 / 1; }
  .m-404 .t { grid-area: 1 / 1; z-index: 1; align-self: end; padding: 26px 28px; }
  .m-404 h3 { margin: 0; font: 400 clamp(40px, 8vw, 104px)/1 var(--serif); }
  .m-404 p { margin: 4px 0 0; font: 400 13px var(--mono); }

  .m-mag { width: min(54vh, 92%); aspect-ratio: 3 / 4; background: #000; color: #fff; display: grid; }
  .m-mag .slot { grid-area: 1 / 1; }
  .m-mag .t { grid-area: 1 / 1; z-index: 1; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; padding: 14px 18px 16px; }
  .m-mag h3 { margin: 0; font: 400 clamp(54px, 13vh, 112px)/0.85 var(--serif); letter-spacing: -0.02em; }
  .m-mag small { font: 500 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
  .m-mag p { margin: 0; align-self: end; grid-row: 3; font: 400 clamp(16px, 3vh, 24px)/1.08 var(--serif); max-width: 22ch; }

  .m-card { width: min(620px, 92%); aspect-ratio: 1.75; background: #f0eee7; display: grid; grid-template-columns: 1.1fr 1fr; }
  .m-card div.t { padding: 8% 7%; display: flex; flex-direction: column; justify-content: space-between; }
  .m-card b { font: 400 clamp(20px, 3vw, 30px)/1.05 var(--serif); display: block; }
  .m-card span { font: 400 10.5px var(--mono); color: #555; }

  .m-story { width: min(38vh, 70%); aspect-ratio: 9 / 16; background: #000; color: #fff; display: grid; border-radius: 12px; overflow: hidden; }
  .m-story .slot { grid-area: 1 / 1; }
  .m-story .t { grid-area: 1 / 1; z-index: 1; align-self: end; padding: 16px; }
  .m-story h3 { margin: 0; font: 800 clamp(24px, 5vh, 40px)/0.95 var(--sans); letter-spacing: -0.04em; }
  .m-story span { display: inline-block; margin-top: 10px; padding: 6px 12px; background: #fff; color: #000; border-radius: 99px; font: 500 12px var(--sans); }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app { height: auto; grid-template-columns: minmax(0, 1fr); }
    .stage { grid-row: 1; height: 70vh; }
    aside.left, aside.right { border: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    .pick { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

<div class="app" id="app">
  <aside class="left">
    <div class="brand"><i>#</i>Keycap Studio</div>
    <section><h2>Subject</h2><div class="pick" id="sources"></div></section>
    <section><h2>Style</h2><div class="pick" id="styles"></div></section>
    <section><h2>Palette</h2><div class="swatches" id="palettes"></div></section>
  </aside>

  <div class="stage">
    <div class="view" id="view">
      <div class="layouts" id="layouts" role="group" aria-label="Layouts"></div>
      <div id="slot-editor" class="slot"><canvas id="art" role="img" aria-label="The current subject rendered as ASCII art"></canvas></div>
      <div id="mockup"></div>
      <div id="toast" hidden></div>
    </div>
    <div class="bar">
      <label class="btn">Upload image<input id="file" type="file" accept="image/*"></label>
      <button id="shuffle" type="button">Shuffle</button>
      <button id="visualize" type="button" aria-pressed="false">Visualize</button>
      <button id="copy-text" type="button">Copy text</button>
      <button id="copy-svg" class="primary" type="button">Copy SVG</button>
    </div>
  </div>

  <aside class="right">
    <section id="dials"></section>
  </aside>
</div>
<!-- script -->
